version: '3.8'

services:
  covua_mysql_db:
    image: mysql:8.0
    container_name: covua_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_covua
    ports:
      - "3306:3306"
    volumes:
      - ./sql/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
      - covua_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  covua_tomcat:
    image: tomcat:9.0-jdk11-openjdk
    container_name: covua_tomcat
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./WebContent:/usr/local/tomcat/webapps/ROOT
    depends_on:
      - covua_mysql_db

volumes:
  covua_db_data:

